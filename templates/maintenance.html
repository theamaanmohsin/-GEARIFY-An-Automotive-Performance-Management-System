{% extends "base.html" %}

{% block head_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='maintenance.css') }}">
{% endblock %}

{% block content %}
<div class="service-form">
    <h2>New Maintenance Entry</h2>
    <form method="POST">
        <div class="form-group">
            <h3>Vehicle Details</h3>
            <input type="text" name="reg_no" placeholder="Registration No. (e.g. LE-1234)" required style="border: 2px solid #007bff;">
            
            <input type="text" name="company" placeholder="Car Company (e.g. Toyota)" required>
            <input type="text" name="model" placeholder="Car Model (e.g. Corolla)" required>
            <input type="number" name="year" placeholder="Manufacturing Year" required>
            <input type="number" name="km" placeholder="Current Odometer (KM)" required>
        </div>

        <div class="form-group">
            <h3>Service Parts</h3>
            
            <label>Select Engine Oil</label>
            <select name="oil">
                {% for name, price in prices['oil'].items() %}
                <option value="{{ name }}">{{ name }} (Rs. {{ price }})</option>
                {% endfor %}
            </select>

            <label>Select Air Filter</label>
            <select name="air_filter">
                {% for name, price in prices['air_filter'].items() %}
                <option value="{{ name }}">{{ name }} (Rs. {{ price }})</option>
                {% endfor %}
            </select>

            <label>Select Oil Filter</label>
            <select name="oil_filter">
                {% for name, price in prices['oil_filter'].items() %}
                <option value="{{ name }}">{{ name }} (Rs. {{ price }})</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="calculate-btn">Calculate Bill & Generate Receipt</button>
    </form>
</div>
{% endblock %}
